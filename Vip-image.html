<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Free online image compression and conversion tool. Optimize, convert to PDF, and enhance image quality.">
  <meta name="keywords" content="image compression, convert image to PDF, HD image converter, image optimizer, reduce image size">
  <meta name="author" content="Your Name">
  <title>All-in-One Image Tool</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f4f4;
      color: #333;
    }
    header, footer {
      background: #333;
      color: #fff;
      text-align: center;
      padding: 1rem;
    }
    .container {
      max-width: 900px;
      margin: 2rem auto;
      padding: 1rem;
      background: #fff;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input[type=file], input[type=range], button {
      width: 100%;
      margin: 1rem 0;
    }
    img {
      max-width: 100%;
      display: block;
      margin-top: 1rem;
    }
    .ad-space {
      margin: 2rem 0;
      text-align: center;
    }
    .tool-section {
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>All-in-One Image Tool</h1>
    <p>Compress, convert to PDF, and enhance your images online</p>
  </header>  <div class="container">
    <label for="imageInput">Select Image:</label>
    <input type="file" id="imageInput" accept="image/*"><label for="compressionLevel">Compression Level: <span id="compressionValue">0.8</span></label>
<input type="range" id="compressionLevel" min="0.1" max="1" step="0.1" value="0.8">

<canvas id="canvas" style="display:none;"></canvas>
<a id="downloadLink" style="display:none;" download="compressed-image.jpg">Download Compressed Image</a>

<img id="preview" alt="Image Preview">

<div class="tool-section">
  <button id="convertToPDF">Convert to PDF</button>
  <a id="pdfDownload" style="display:none;" download="image.pdf">Download PDF</a>
</div>

<div class="ad-space">
  <!-- Google AdSense Ad Unit -->
  <ins class="adsbygoogle"
       style="display:block"
       data-ad-client="ca-pub-xxxxxxxxxxxxxxxx"
       data-ad-slot="1234567890"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"></script>
  <script>
       (adsbygoogle = window.adsbygoogle || []).push({});
  </script>
</div>

  </div>  <footer>
    <p>&copy; 2025 All-in-One Image Tool</p>
  </footer>  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>  <script>
    const imageInput = document.getElementById('imageInput');
    const compressionLevel = document.getElementById('compressionLevel');
    const compressionValue = document.getElementById('compressionValue');
    const canvas = document.getElementById('canvas');
    const downloadLink = document.getElementById('downloadLink');
    const preview = document.getElementById('preview');
    const convertToPDF = document.getElementById('convertToPDF');
    const pdfDownload = document.getElementById('pdfDownload');

    let currentImage = null;

    compressionLevel.addEventListener('input', () => {
      compressionValue.textContent = compressionLevel.value;
    });

    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);

          const quality = parseFloat(compressionLevel.value);
          canvas.toBlob((blob) => {
            const url = URL.createObjectURL(blob);
            preview.src = url;
            downloadLink.href = url;
            downloadLink.style.display = 'inline-block';
            currentImage = url;
          }, 'image/jpeg', quality);
        }
        img.src = event.target.result;
      }
      reader.readAsDataURL(file);
    });

    convertToPDF.addEventListener('click', async () => {
      if (!currentImage) return;
      const img = new Image();
      img.src = currentImage;
      img.onload = () => {
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF();
        const width = pdf.internal.pageSize.getWidth();
        const height = (img.height / img.width) * width;
        pdf.addImage(img, 'JPEG', 0, 0, width, height);
        const pdfBlob = pdf.output('blob');
        const url = URL.createObjectURL(pdfBlob);
        pdfDownload.href = url;
        pdfDownload.style.display = 'inline-block';
      }
    });
  </script></body>
</html>
